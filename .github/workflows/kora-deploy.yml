name: Deploy KORA

# Manual only — triggered from the Actions tab (or by Claude via the API) once the required
# repository secrets below are set. Safe to re-run: every step is idempotent, so running this
# again (e.g. after adding the WhatsApp/Anthropic secrets later) just brings things up to date.
on:
  workflow_dispatch:

concurrency:
  group: kora-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.KORA_SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.KORA_SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ secrets.KORA_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.KORA_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Guard required secrets
        run: |
          missing=()
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing+=("KORA_SUPABASE_ACCESS_TOKEN")
          [ -z "$PROJECT_REF" ] && missing+=("KORA_SUPABASE_PROJECT_REF")
          [ -z "$SUPABASE_URL" ] && missing+=("KORA_SUPABASE_URL")
          [ -z "$SUPABASE_ANON_KEY" ] && missing+=("KORA_SUPABASE_ANON_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required repository secrets: ${missing[*]}"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Apply database schema
        run: |
          set -euo pipefail
          jq -Rs '{query: .}' kora/supabase/schema.sql > /tmp/schema-query.json
          http_code=$(curl -sS -o /tmp/schema-response.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/schema-query.json)
          cat /tmp/schema-response.json
          echo
          if [ "$http_code" -ge 300 ]; then
            echo "::error::Schema apply failed with HTTP $http_code"
            exit 1
          fi

      - name: Deploy Edge Functions
        working-directory: kora
        run: |
          set -euo pipefail
          npx --yes supabase@latest functions deploy quote-calculate --project-ref "$PROJECT_REF"
          npx --yes supabase@latest functions deploy available-guards --project-ref "$PROJECT_REF"
          npx --yes supabase@latest functions deploy invoice-generate --project-ref "$PROJECT_REF"
          npx --yes supabase@latest functions deploy employee-portal --project-ref "$PROJECT_REF" --no-verify-jwt
          npx --yes supabase@latest functions deploy whatsapp-webhook --project-ref "$PROJECT_REF" --no-verify-jwt
          npx --yes supabase@latest functions deploy whatsapp-outbound --project-ref "$PROJECT_REF"
          npx --yes supabase@latest functions deploy ai-assistant --project-ref "$PROJECT_REF" --no-verify-jwt
          npx --yes supabase@latest functions deploy credential-expiry-scan --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Set function secrets
        working-directory: kora
        env:
          KORA_APP_ORIGIN: ${{ secrets.KORA_APP_ORIGIN }}
          ANTHROPIC_API_KEY: ${{ secrets.KORA_ANTHROPIC_API_KEY }}
          WHATSAPP_TOKEN: ${{ secrets.KORA_WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.KORA_WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_APP_SECRET: ${{ secrets.KORA_WHATSAPP_APP_SECRET }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.KORA_WHATSAPP_VERIFY_TOKEN }}
        run: |
          set -euo pipefail
          INTERNAL_SECRET=$(openssl rand -hex 32)
          echo "INTERNAL_SECRET=${INTERNAL_SECRET}" >> "$GITHUB_ENV"

          args=(
            "KORA_INTERNAL_SECRET=${INTERNAL_SECRET}"
            "ANTHROPIC_MODEL=claude-sonnet-5"
          )
          [ -n "${KORA_APP_ORIGIN:-}" ] && args+=("KORA_APP_ORIGIN=${KORA_APP_ORIGIN}")
          [ -n "${ANTHROPIC_API_KEY:-}" ] && args+=("ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}")
          [ -n "${WHATSAPP_TOKEN:-}" ] && args+=("WHATSAPP_TOKEN=${WHATSAPP_TOKEN}")
          [ -n "${WHATSAPP_PHONE_NUMBER_ID:-}" ] && args+=("WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}")
          [ -n "${WHATSAPP_APP_SECRET:-}" ] && args+=("WHATSAPP_APP_SECRET=${WHATSAPP_APP_SECRET}")
          [ -n "${WHATSAPP_VERIFY_TOKEN:-}" ] && args+=("WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN}")

          npx --yes supabase@latest secrets set "${args[@]}" --project-ref "$PROJECT_REF"

      - name: Schedule daily credential-expiry scan
        run: |
          set -euo pipefail
          cat > /tmp/cron.sql <<SQL
          create extension if not exists pg_cron;
          create extension if not exists pg_net;

          do \$do\$
          begin
            perform cron.unschedule(jobid) from cron.job where jobname = 'kora-credential-expiry-scan';
          exception when others then null;
          end;
          \$do\$;

          select cron.schedule(
            'kora-credential-expiry-scan',
            '0 6 * * *',
            \$cron\$
            select net.http_post(
              url := '${SUPABASE_URL}/functions/v1/credential-expiry-scan',
              headers := jsonb_build_object('X-Internal-Secret', '${INTERNAL_SECRET}', 'Content-Type', 'application/json')
            );
            \$cron\$
          );
          SQL
          jq -Rs '{query: .}' /tmp/cron.sql > /tmp/cron-query.json
          http_code=$(curl -sS -o /tmp/cron-response.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/cron-query.json)
          cat /tmp/cron-response.json
          echo
          if [ "$http_code" -ge 300 ]; then
            echo "::warning::Cron scheduling failed with HTTP $http_code — enable the pg_cron and pg_net extensions under Database → Extensions in the Supabase dashboard, then re-run this workflow."
          fi

      - name: Deploy frontend to Vercel
        if: ${{ secrets.KORA_VERCEL_TOKEN != '' }}
        working-directory: kora/app
        env:
          VERCEL_TOKEN: ${{ secrets.KORA_VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest link --yes --project=kora-app --token="$VERCEL_TOKEN"
          npx --yes vercel@latest env rm VITE_SUPABASE_URL production --yes --token="$VERCEL_TOKEN" || true
          npx --yes vercel@latest env rm VITE_SUPABASE_ANON_KEY production --yes --token="$VERCEL_TOKEN" || true
          echo "$SUPABASE_URL" | npx --yes vercel@latest env add VITE_SUPABASE_URL production --token="$VERCEL_TOKEN"
          echo "$SUPABASE_ANON_KEY" | npx --yes vercel@latest env add VITE_SUPABASE_ANON_KEY production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          DEPLOY_URL=$(npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "DEPLOY_URL=${DEPLOY_URL}" >> "$GITHUB_ENV"

      - name: Summary
        if: always()
        run: |
          {
            echo "## KORA deploy"
            echo ""
            echo "- WhatsApp webhook callback URL (paste into Meta): \`${SUPABASE_URL}/functions/v1/whatsapp-webhook\`"
            if [ -n "${DEPLOY_URL:-}" ]; then
              echo "- Frontend: ${DEPLOY_URL}"
            else
              echo "- Frontend: not deployed this run (set KORA_VERCEL_TOKEN to enable)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
